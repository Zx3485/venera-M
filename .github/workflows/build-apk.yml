name: Build APK (patched)

on:
  workflow_dispatch:
  push:
    # 推任意分支都编译，方便在特性分支上试改；但只有 master 才发 Release
    branches: ['**']

# 发 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # 固定签名：没有它每次构建的 debug keystore 都不同，新包无法覆盖安装。
      # 需要两个 Secret：KEYSTORE_BASE64（key.jks 的 base64）、KEYSTORE_PROPS（key.properties 全文）
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将退回 debug 签名（无法覆盖安装）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks
          printf '%s' "$KEYSTORE_PROPS" > android/app/key.properties
          echo "签名密钥已写入"

      # 从 pubspec.yaml 读版本号，顺便构造 release tag
      - name: Read version
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | head -1 | cut -d':' -f2 | tr -d ' ')
          echo "full=$V" >> $GITHUB_OUTPUT
          echo "short=${V%%+*}" >> $GITHUB_OUTPUT
          echo "version: $V"

      # App 显示的版本号是 lib/foundation/app.dart 里写死的常量，不是读 pubspec。
      # 忘同步会导致「检查更新」永远认为有新版本（本机版本更低），所以每次构建强制对齐。
      - name: Sync version into app.dart
        run: |
          V="${{ steps.ver.outputs.short }}"
          echo "把 app.dart 里的版本对齐到 $V"
          sed -i -E "s/final version = \"[^\"]*\";/final version = \"$V\";/" lib/foundation/app.dart
          grep -n 'final version =' lib/foundation/app.dart
          # 确认真的改到了，没改到就直接失败，不要产出版本号不对的包
          grep -q "final version = \"$V\";" lib/foundation/app.dart || {
            echo "::error::app.dart 版本同步失败，找不到 final version 行"
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # rhttp / flutter_qjs build through Rust; this pins the toolchain
      # declared in rust-toolchain.toml.
      - name: Check rust toolchain
        run: rustup show

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v5
        with:
          name: venera-apk
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error

      # 自动发 Release：App 里的「检查更新」查的就是这里
      # tag 用 v<version>，App 侧会剥掉 v 再比版本号
      # ⚠ 只在 master 上发：特性分支编译出来只作为 Artifact 供测试，
      #   否则每个分支都会抢同一个 tag，Release 会互相覆盖。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.short }}"
          echo "发布 $TAG"
          # 同名 release 已存在就先删掉，方便重跑
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            build/app/outputs/apk/release/*.apk \
            --title "venera-M ${{ steps.ver.outputs.short }}" \
            --notes "自动构建，来源 commit ${{ github.sha }}"
